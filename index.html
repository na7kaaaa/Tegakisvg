<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tegaki.svg 原稿切り出し</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#14171c;
    --panel:#1b2028;
    --panel2:#232a35;
    --accent:#4f6d8f;
    --accent-soft:#7d95ac;
    --line:#333c48;
    --ok:#6fae7c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:#e7e9ec;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    display:flex;
  }
  #controls{
    width:340px;
    min-width:340px;
    height:100vh;
    overflow-y:auto;
    background:var(--panel);
    padding:20px 18px 40px;
    border-right:1px solid var(--line);
  }
  h1{ font-size:15px; margin:0 0 2px; color:#fff; }
  .sub{ font-size:11px; color:var(--accent-soft); margin-bottom:18px; }
  fieldset{
    border:1px solid var(--line);
    border-radius:6px;
    margin:0 0 14px;
    padding:10px 12px 12px;
  }
  legend{ font-size:11px; color:var(--accent-soft); padding:0 4px; }
  .step{ font-size:11px; color:#8b94a1; margin-bottom:6px; line-height:1.5; }
  input[type=file]{ width:100%; font-size:12px; color:#ccc; margin-bottom:8px; }
  .num-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; margin:6px 0;
  }
  .num-row input[type=number]{
    width:80px; background:var(--panel2); border:1px solid var(--line);
    color:#fff; border-radius:4px; padding:4px 6px; font-size:12px;
  }
  button{
    width:100%; padding:10px; border:none; border-radius:6px;
    font-size:13px; font-weight:600; cursor:pointer; margin-top:6px;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  #resetPts{ background:var(--panel2); color:#e7e9ec; border:1px solid var(--line); }
  #slice{ background:var(--accent); color:#fff; }
  #slice:hover:not(:disabled){ background:#5c7ea3; }
  #zipBtn{ background:var(--ok); color:#0e1712; }
  #log{
    font-size:11px; color:#8b94a1; margin-top:10px; line-height:1.6;
    white-space:pre-wrap;
  }
  #viewer{ flex:1; height:100vh; overflow:auto; background:#3a4048; padding:24px; }
  #srcWrap{ position:relative; display:inline-block; max-width:100%; }
  #srcCanvas{ max-width:100%; display:block; cursor:crosshair; background:#000; }
  #result{ margin-top:20px; }
  .cellThumb{
    display:inline-flex; flex-direction:column; align-items:center;
    width:64px; margin:2px; font-size:9px; color:#ccc;
  }
  .cellThumb canvas{ background:#fff; border:1px solid #555; }
  .cellThumb.blank canvas{ opacity:.3; }
  .hint{ color:#dcd9c8; font-size:11px; margin-bottom:8px; }
</style>
</head>
<body>

<div id="controls">
  <h1>tegaki.svg 原稿切り出し</h1>
  <div class="sub">撮影した原稿1ページから、4隅指定→補正→マス分割→文字ラベル付きで書き出し</div>

  <fieldset>
    <legend>1. 文字リスト</legend>
    <div class="step">tegaki-char-order.json を読み込んでください</div>
    <input type="file" id="jsonFile" accept="application/json">
    <div class="step" id="jsonStatus">未読み込み</div>
  </fieldset>

  <fieldset>
    <legend>2. 原稿写真</legend>
    <input type="file" id="imgFile" accept="image/*">
    <div class="step" id="imgStatus">未読み込み</div>
  </fieldset>

  <fieldset>
    <legend>3. グリッド設定</legend>
    <div class="num-row"><span>列数（横）</span><input type="number" id="cols" value="10" min="1"></div>
    <div class="num-row"><span>行数（縦）</span><input type="number" id="rows" value="12" min="1"></div>
    <div class="num-row"><span>開始文字番号</span><input type="number" id="startIdx" value="1" min="1"></div>
    <div class="step">原稿ページ左上の「No.○-○」の左側の数字を入れてください</div>
  </fieldset>

  <fieldset>
    <legend>4. 補正用の4点</legend>
    <div class="step">右の画像で、マスが並んでいる範囲の <b>外枠の4隅</b> を<br>左上→右上→右下→左下 の順にクリック</div>
    <div class="step" id="ptStatus">0 / 4 点</div>
    <button id="resetPts">4点をやり直す</button>
  </fieldset>

  <button id="slice" disabled>この設定で切り出す</button>
  <button id="zipBtn" disabled>ZIPでダウンロード</button>

  <div id="log">準備中…</div>
</div>

<div id="viewer">
  <div class="hint">画像をクリックして4隅を指定してください（左上→右上→右下→左下）</div>
  <div id="srcWrap">
    <canvas id="srcCanvas"></canvas>
  </div>
  <div id="result"></div>
</div>

<script>
// ---- 4点透視変換（general 2D projection） ----
function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]];}
function multmm(a,b){var c=Array(9);for(var i=0;i!=3;++i)for(var j=0;j!=3;++j){var s=0;for(var k=0;k!=3;++k)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;}return c;}
function multmv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];}
function basisToPoints(x1,y1,x2,y2,x3,y3,x4,y4){var m=[x1,x2,x3,y1,y2,y3,1,1,1];var v=multmv(adj(m),[x4,y4,1]);return multmm(m,[v[0],0,0,0,v[1],0,0,0,v[2]]);}
function general2DProjection(x1s,y1s,x1d,y1d,x2s,y2s,x2d,y2d,x3s,y3s,x3d,y3d,x4s,y4s,x4d,y4d){var s=basisToPoints(x1s,y1s,x2s,y2s,x3s,y3s,x4s,y4s);var d=basisToPoints(x1d,y1d,x2d,y2d,x3d,y3d,x4d,y4d);return multmm(d,adj(s));}
function project(m,x,y){var v=multmv(m,[x,y,1]);return[v[0]/v[2],v[1]/v[2]];}

// ---- state ----
let characters = null;
let srcImage = null;
let srcCanvas = document.getElementById("srcCanvas");
let srcCtx = srcCanvas.getContext("2d");
let points = []; // クリックされた4点（画像の実ピクセル座標）
let scaleShown = 1; // 画面表示上のスケール（クリック座標の補正用）
let cellResults = []; // {index, char, canvas}

const CELL_PX = 200; // 1マスあたりの出力解像度

function log(msg){ document.getElementById("log").textContent = msg; }

// ---- 1. JSON読み込み ----
document.getElementById("jsonFile").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      characters = data.characters;
      document.getElementById("jsonStatus").textContent = `読み込み済み（${characters.length}文字）`;
      checkReady();
    }catch(err){
      document.getElementById("jsonStatus").textContent = "JSONの読み込みに失敗しました";
    }
  };
  reader.readAsText(f);
});

// ---- 2. 画像読み込み ----
document.getElementById("imgFile").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = ()=>{
    srcImage = img;
    points = [];
    updatePtStatus();
    const maxW = 1400;
    scaleShown = img.width > maxW ? maxW / img.width : 1;
    srcCanvas.width = img.width * scaleShown;
    srcCanvas.height = img.height * scaleShown;
    redrawSrc();
    document.getElementById("imgStatus").textContent = `読み込み済み（${img.width}×${img.height}px）`;
    checkReady();
  };
  img.src = url;
});

function redrawSrc(){
  srcCtx.clearRect(0,0,srcCanvas.width,srcCanvas.height);
  srcCtx.drawImage(srcImage, 0,0, srcCanvas.width, srcCanvas.height);
  const labels = ["①左上","②右上","③右下","④左下"];
  points.forEach((p,i)=>{
    const x = p.x*scaleShown, y = p.y*scaleShown;
    srcCtx.fillStyle = "#ff5555";
    srcCtx.beginPath();
    srcCtx.arc(x,y,6,0,Math.PI*2);
    srcCtx.fill();
    srcCtx.fillStyle = "#fff";
    srcCtx.font = "14px sans-serif";
    srcCtx.fillText(labels[i], x+8, y-8);
  });
}

srcCanvas.addEventListener("click", (e)=>{
  if(!srcImage || points.length>=4) return;
  const rect = srcCanvas.getBoundingClientRect();
  const dispX = (e.clientX-rect.left) * (srcCanvas.width/rect.width);
  const dispY = (e.clientY-rect.top) * (srcCanvas.height/rect.height);
  points.push({ x: dispX/scaleShown, y: dispY/scaleShown }); // 画像の実ピクセル座標で保持
  redrawSrc();
  updatePtStatus();
  checkReady();
});

document.getElementById("resetPts").addEventListener("click", ()=>{
  points = [];
  redrawSrc();
  updatePtStatus();
  checkReady();
});

function updatePtStatus(){
  document.getElementById("ptStatus").textContent = `${points.length} / 4 点`;
}

function checkReady(){
  const ready = characters && srcImage && points.length===4;
  document.getElementById("slice").disabled = !ready;
}

// ---- 4. 切り出し実行 ----
document.getElementById("slice").addEventListener("click", ()=>{
  const cols = parseInt(document.getElementById("cols").value) || 10;
  const rows = parseInt(document.getElementById("rows").value) || 12;
  const startIdx = parseInt(document.getElementById("startIdx").value) || 1;

  const W = cols * CELL_PX;
  const H = rows * CELL_PX;

  // 補正後キャンバス(0,0)-(W,H) の4隅 -> 元画像でクリックした4点、への変換行列
  const M = general2DProjection(
    0,0,           points[0].x, points[0].y,
    W,0,           points[1].x, points[1].y,
    W,H,           points[2].x, points[2].y,
    0,H,           points[3].x, points[3].y
  );

  // 元画像を丸ごとcanvasに載せてピクセルを読めるようにする
  const full = document.createElement("canvas");
  full.width = srcImage.width;
  full.height = srcImage.height;
  const fullCtx = full.getContext("2d");
  fullCtx.drawImage(srcImage, 0, 0);
  const srcData = fullCtx.getImageData(0,0,full.width,full.height);

  const rectified = document.createElement("canvas");
  rectified.width = W;
  rectified.height = H;
  const rCtx = rectified.getContext("2d");
  const outData = rCtx.createImageData(W,H);

  for(let y=0; y<H; y++){
    for(let x=0; x<W; x++){
      const [sx, sy] = project(M, x+0.5, y+0.5);
      const ix = Math.round(sx), iy = Math.round(sy);
      const outOff = (y*W+x)*4;
      if(ix>=0 && iy>=0 && ix<full.width && iy<full.height){
        const inOff = (iy*full.width+ix)*4;
        outData.data[outOff]   = srcData.data[inOff];
        outData.data[outOff+1] = srcData.data[inOff+1];
        outData.data[outOff+2] = srcData.data[inOff+2];
        outData.data[outOff+3] = 255;
      }else{
        outData.data[outOff]=255; outData.data[outOff+1]=255;
        outData.data[outOff+2]=255; outData.data[outOff+3]=255;
      }
    }
  }
  rCtx.putImageData(outData, 0, 0);

  // マス分割
  cellResults = [];
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";
  const grid = document.createElement("div");

  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const idx = r*cols + c;
      const listIdx = startIdx - 1 + idx;
      const ch = (characters && listIdx < characters.length) ? characters[listIdx] : null;

      const cellCanvas = document.createElement("canvas");
      cellCanvas.width = CELL_PX;
      cellCanvas.height = CELL_PX;
      cellCanvas.getContext("2d").drawImage(
        rectified, c*CELL_PX, r*CELL_PX, CELL_PX, CELL_PX, 0,0, CELL_PX, CELL_PX
      );

      cellResults.push({ index: listIdx+1, char: ch, canvas: cellCanvas });

      const thumb = document.createElement("div");
      thumb.className = "cellThumb" + (ch ? "" : " blank");
      const small = document.createElement("canvas");
      small.width = 56; small.height = 56;
      small.getContext("2d").drawImage(cellCanvas, 0,0,56,56);
      thumb.appendChild(small);
      const label = document.createElement("span");
      label.textContent = ch ? `${listIdx+1}:${ch}` : "-";
      thumb.appendChild(label);
      grid.appendChild(thumb);
    }
  }
  resultEl.appendChild(grid);

  log(`切り出し完了: ${cellResults.length}マス（${startIdx}〜${startIdx+cellResults.length-1}文字目）`);
  document.getElementById("zipBtn").disabled = false;
});

// ---- ZIP書き出し ----
document.getElementById("zipBtn").addEventListener("click", async ()=>{
  log("ZIPを作成しています…");
  const zip = new JSZip();
  const manifest = [];

  for(const cell of cellResults){
    if(!cell.char) continue; // 文字リスト範囲外の空マスはスキップ
    const codepoint = cell.char.codePointAt(0).toString(16).toUpperCase().padStart(4,"0");
    const filename = `${String(cell.index).padStart(4,"0")}_U+${codepoint}.png`;
    const dataUrl = cell.canvas.toDataURL("image/png");
    const base64 = dataUrl.split(",")[1];
    zip.file(filename, base64, {base64:true});
    manifest.push({ index: cell.index, char: cell.char, codepoint: "U+"+codepoint, filename });
  }
  zip.file("manifest.json", JSON.stringify(manifest, null, 2));

  const blob = await zip.generateAsync({type:"blob"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tegaki-cells.zip";
  a.click();
  URL.revokeObjectURL(url);
  log(`ZIPを書き出しました（${manifest.length}マス分）`);
});

log("① 文字リストJSON → ② 原稿写真 → ③ グリッド設定 → ④ 4隅クリック の順に進めてください");
</script>
</body>
</html>
